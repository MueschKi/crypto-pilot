name: PUCK PULSE - isolated Safari game
on:
  push:
    branches: [main]
    paths:
      - 'puck-pulse/**'
      - 'puck-pulse-worker.jsonc'
      - 'scripts/test-puck-pulse.mjs'
      - 'scripts/test-puck-pulse-browser.py'
      - '.github/workflows/puck-pulse-cloudflare.yml'
  pull_request:
    branches: [main]
    paths:
      - 'puck-pulse/**'
      - 'puck-pulse-worker.jsonc'
      - 'scripts/test-puck-pulse.mjs'
      - 'scripts/test-puck-pulse-browser.py'
      - '.github/workflows/puck-pulse-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: puck-pulse-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Validate PUCK PULSE + mobile Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript, feature set and isolated Worker
        run: node scripts/test-puck-pulse.mjs
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test phone, landscape, tablet and puck physics
        run: python scripts/test-puck-pulse-browser.py
  deploy:
    name: Deploy only standalone Air Hockey
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy independent PUCK PULSE Cloudflare Free Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Cloudflare API token missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Cloudflare account ID missing"; exit 1; }
          npx --yes wrangler@4 deploy --config puck-pulse-worker.jsonc
      - name: Verify Safari game on production URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://puck-pulse.zkhfffrvws.workers.dev/"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 15 "$URL" -o /tmp/puck-pulse-live.html; then
              if grep -q 'PUCK PULSE' /tmp/puck-pulse-live.html \
                && grep -q 'id="startBtn"' /tmp/puck-pulse-live.html \
                && grep -q 'data-mode="ai"' /tmp/puck-pulse-live.html \
                && grep -q 'data-mode="local"' /tmp/puck-pulse-live.html \
                && grep -q 'id="rink"' /tmp/puck-pulse-live.html; then
                echo "PUBLIC SAFARI GAME VERIFIED: $URL"
                exit 0
              fi
            fi
            echo "Site not ready or content mismatch ($attempt/15)"
            sleep 8
          done
          echo "::error::PUCK PULSE production content not verified"
          exit 1
