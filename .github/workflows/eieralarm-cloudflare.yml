name: EIERALARM LCD – Safari and Cloudflare
on:
  push:
    branches: [main]
    paths:
      - 'docs/eieralarm/**'
      - 'scripts/test-eieralarm.mjs'
      - 'scripts/test-eieralarm-browser.py'
      - 'eieralarm-worker.jsonc'
      - '.github/workflows/eieralarm-cloudflare.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/eieralarm/**'
      - 'scripts/test-eieralarm.mjs'
      - 'scripts/test-eieralarm-browser.py'
      - 'eieralarm-worker.jsonc'
      - '.github/workflows/eieralarm-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eieralarm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Game rules and Safari HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game and four LCD positions
        run: node scripts/test-eieralarm.mjs
      - name: Verify EIERALARM SVG source syntax
        run: node --check docs/eieralarm/art.js
      - name: Install browser test tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Mobile Chromium smoke test
        run: python scripts/test-eieralarm-browser.py
      - name: Validate Worker config
        shell: bash
        run: |
          node -e 'const c=JSON.parse(require("node:fs").readFileSync("eieralarm-worker.jsonc","utf8"));if(c.name!=="eieralarm-lcd"||!c.workers_dev||c.assets.directory!=="./docs/eieralarm")process.exit(1)'
  deploy:
    name: Deploy isolated EIERALARM static Worker
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy only EIERALARM (never CryptoPilot)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID missing"; exit 1; }
          npx --yes wrangler@4 deploy --config eieralarm-worker.jsonc
      - name: Verify publicly reachable Safari game
        shell: bash
        run: |
          set -euo pipefail
          URL="https://eieralarm-lcd.zkhfffrvws.workers.dev/"
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 15 "$URL" -o /tmp/eieralarm-live.html && grep -q 'EIERALARM LCD' /tmp/eieralarm-live.html && grep -q 'data-lane="tl"' /tmp/eieralarm-live.html && grep -q '>v1.3</text>' /tmp/eieralarm-live.html && grep -q 'art.js?v=1.3' /tmp/eieralarm-live.html && grep -q 'id="hare"' /tmp/eieralarm-live.html; then
              curl --fail --silent --show-error --location --max-time 15 "${URL}art.js?v=1.3" -o /tmp/eieralarm-art.js
              grep -q "artWolf" /tmp/eieralarm-art.js && grep -q "henHouse" /tmp/eieralarm-art.js || { echo "::error::New vector art asset is missing"; exit 1; }
              echo "LIVE VERIFIED: $URL"
              exit 0
            fi
            echo "Live page not yet ready ($attempt/15)"
            sleep 10
          done
          echo "::error::EIERALARM not publicly reachable or wrong content"
          exit 1
