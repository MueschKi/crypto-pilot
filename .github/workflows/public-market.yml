name: CryptoPilot Top-20-Marktbericht
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Analyse oeffentlicher Top-20- und Kraken-EUR-Daten
        run: python src/bot.py market > crypto-pilot-market-report.json
      - name: Zusammenfassung anzeigen
        run: |
          python - <<'PY'
          import json
          data=json.load(open('crypto-pilot-market-report.json'))['report']
          print('Top-20:', len(data['universe']))
          print('Analysiert:', data['counts']['analyzed'])
          for row in data['universe']:
              print(row['rank'],row['symbol'],row['status'])
          PY
      - name: Marktbericht als Datei bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: crypto-pilot-market-report
          path: crypto-pilot-market-report.json
          retention-days: 7
