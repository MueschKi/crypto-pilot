<script>
/* Eieralarm! — standalone deterministic arcade rules, ES modules. */
const LANES = ['tl', 'tr', 'bl', 'br'];
const MODE = Object.freeze({ classic: 'classic', turbo: 'turbo' });
class EggGame {
  constructor(random = Math.random) { this.random = random; this.reset(); }
  reset() {
    this.status='ready'; this.mode=MODE.classic; this.score=0;
    this.misses=0; this.missedEggs=0; this.caught=0; this.combo=0; this.maxCombo=0;
    this.lane='bl'; this.eggs=[]; this.elapsed=0; this.spawnClock=0; this.lastSpawnLane=null;
    this.hareVisible=false; this.chickUntil=0; this.chickLane=null;
    this.events=[]; this.nextId=1;
  }
  start(mode=MODE.classic) {
    if(!Object.values(MODE).includes(mode))throw new Error('Invalid mode');
    this.reset();this.mode=mode;this.status='running';this.spawnClock=400;
    this.events.push({type:'start',mode});
  }
  selectLane(lane) {
    if(!LANES.includes(lane))return false;
    if(this.lane!==lane){this.lane=lane;this.events.push({type:'move',lane});}
    return true;
  }
  togglePause(){
    if(this.status==='running'){this.status='paused';this.events.push({type:'pause'});}
    else if(this.status==='paused'){this.status='running';this.events.push({type:'resume'});}
    return this.status;
  }
  activeLanes() {
    if(this.mode===MODE.turbo)return LANES;
    // Game A uses three chutes; the unused chute depends on the penalty tally.
    const unused=this.misses===0?'bl':this.misses<=1?'br':this.misses<=2?'tl':'tr';
    return LANES.filter(lane=>lane!==unused);
  }
  spawnDelay() {
    // Ten-egg speed steps, with a short speed relief every 100 points.
    const century=Math.floor(this.score/100),step=Math.floor((this.score%100)/10);
    const base=this.mode===MODE.turbo?1180:1500;
    return Math.max(this.mode===MODE.turbo?470:570,base-century*112-step*45);
  }
  travelTime() {
    const century=Math.floor(this.score/100),step=Math.floor((this.score%100)/10);
    const base=this.mode===MODE.turbo?3040:3740;
    return Math.max(this.mode===MODE.turbo?1500:1740,base-century*165-step*93);
  }
  chooseLane() {
    const active=this.activeLanes();
    const options=active.filter(lane=>lane!==this.lastSpawnLane);
    const lanes=options.length?options:active;
    const roll=Math.max(0,Math.min(.999999999,Number(this.random())||0));
    return lanes[Math.floor(roll*lanes.length)];
  }
  spawnEgg(lane=this.chooseLane(),overrides={}) {
    if(!LANES.includes(lane))throw new Error('Invalid lane');
    const egg={id:this.nextId++,lane,progress:overrides.progress??0,
      travelMs:overrides.travelMs??this.travelTime()};
    this.eggs.push(egg);this.lastSpawnLane=lane;
    this.events.push({type:'spawn',lane});
    return egg;
  }
  tick(deltaMs) {
    if(this.status!=='running')return;
    const dt=Math.max(0,Math.min(250,Number(deltaMs)||0));
    this.elapsed+=dt;
    const wasVisible=this.hareVisible;
    // An occasional rabbit in the top-left window halves a missed-egg penalty.
    const phase=this.elapsed%11900;
    this.hareVisible=phase>=5500&&phase<8550;
    if(wasVisible!==this.hareVisible)this.events.push({type:'hare',visible:this.hareVisible});
    this.spawnClock+=dt;
    const delay=this.spawnDelay();
    if(this.spawnClock>=delay&&this.eggs.length<5){
      this.spawnClock-=delay;this.spawnEgg();
    }
    const remaining=[];
    for(const egg of this.eggs){
      egg.progress+=dt/egg.travelMs;
      if(egg.progress<1){remaining.push(egg);continue;}
      if(egg.lane===this.lane){
        this.caught++;this.combo++;this.maxCombo=Math.max(this.combo,this.maxCombo);
        this.score++;
        this.events.push({type:'catch',lane:egg.lane,earned:1,score:this.score});
        if(this.score%1000===200||this.score%1000===500){
          this.misses=0;this.events.push({type:'bonus',score:this.score});
        }
      } else {
        this.missedEggs++;this.combo=0;
        const penalty=this.hareVisible?.5:1;
        this.misses=Math.min(3,this.misses+penalty);
        this.chickUntil=this.hareVisible?this.elapsed+850:0;this.chickLane=this.hareVisible?egg.lane:null;
        this.events.push({type:'miss',lane:egg.lane,penalty,misses:this.misses});
        if(this.misses>=3){
          this.status='over';this.events.push({type:'gameover',score:this.score});
          break;
        }
      }
    }
    this.eggs=this.status==='over'?[]:remaining;
  }
  drainEvents(){return this.events.splice(0);}
}

const game=new EggGame();const $=id=>document.getElementById(id);const lanes={tl:{start:[268,222],end:[458,294]},tr:{start:[813,222],end:[622,294]},bl:{start:[268,364],end:[458,403]},br:{start:[813,364],end:[622,403]}};
let selectedMode=MODE.classic;try{selectedMode=localStorage.getItem('eieralarm-lcd-mode')||MODE.classic}catch{}if(!Object.values(MODE).includes(selectedMode))selectedMode=MODE.classic;
let last=0,sound=true,audio=null;let best={classic:0,turbo:0};for(const key of ['classic','turbo']){try{best[key]=Number(localStorage.getItem('eieralarm-lcd-best-'+key))||0}catch{}}
function beep(freq=590,duration=.047){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const oscillator=audio.createOscillator(),gain=audio.createGain();oscillator.type='square';oscillator.frequency.value=freq;gain.gain.value=.024;oscillator.connect(gain);gain.connect(audio.destination);oscillator.start();oscillator.stop(audio.currentTime+duration);}catch{}}
function position(lane){if(!LANES.includes(lane))return;game.selectLane(lane);draw();beep(420,.023)}
for(const control of document.querySelectorAll('[data-lane]')){control.addEventListener('pointerdown',e=>{e.preventDefault();position(control.dataset.lane)});control.addEventListener('click',()=>position(control.dataset.lane));}
function start(mode=selectedMode){selectedMode=mode;try{localStorage.setItem('eieralarm-lcd-mode',mode)}catch{}game.start(mode);$('message').textContent='';$('start').hidden=true;beep(750,.08);draw();}
for(const el of document.querySelectorAll('.micro-button'))el.addEventListener('click',()=>{const type=el.dataset.action;if(type==='classic')start(MODE.classic);else if(type==='turbo')start(MODE.turbo);else if(game.status==='paused'){game.togglePause();$('message').textContent='';$('start').hidden=true;draw()}else if(game.status==='running'){game.togglePause();$('message').textContent='PAUSE';$('start').hidden=false;$('start').textContent='▶ WEITERSPIELEN';draw()}});
$('start').addEventListener('click',()=>{if(game.status==='paused'){game.togglePause();$('message').textContent='';$('start').hidden=true;draw()}else start(selectedMode)});
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();const map={q:'tl',w:'tr',a:'bl',s:'br',arrowleft:game.lane[0]==='t'?'tl':'bl',arrowright:game.lane[0]==='t'?'tr':'br',arrowup:game.lane[1]==='l'?'tl':'tr',arrowdown:game.lane[1]==='l'?'bl':'br'};if(map[key]){e.preventDefault();position(map[key])}if(key===' '||key==='enter'){e.preventDefault();if(game.status==='ready'||game.status==='over')start();else if(game.status==='paused'){$('start').click();}}});
const svgNS='http://www.w3.org/2000/svg';function node(tag,attr){const n=document.createElementNS(svgNS,tag);Object.entries(attr).forEach(([k,v])=>n.setAttribute(k,v));return n;}
function draw(){
 const left=game.lane.endsWith('l'),upper=game.lane.startsWith('t');
 // The complete smaller wolf walks sideways and changes height. His basket
 // sits at the corresponding end of the four original-style egg chutes.
 const cx=left?506:574,cy=upper?337:388;
 $('wolf').setAttribute('transform','translate('+cx+' '+cy+') scale('+(left?'.68':'-.68')+' .68) translate(-540 -365)');
 $('arm').setAttribute('d',upper?'M516 365 Q493 343 472 316':'M516 365 Q493 380 472 380');
 $('basket').setAttribute('transform','translate(470 '+(upper?303:388)+')');
 $('hare').setAttribute('opacity',game.hareVisible?'1':'0');
 const eggs=$('eggs');eggs.replaceChildren();
 for(const egg of game.eggs){
   const c=lanes[egg.lane],segment=Math.min(5,Math.max(0,Math.floor(egg.progress*6)));
   const p=(segment+.58)/6;
   const ex=c.start[0]+(c.end[0]-c.start[0])*p;
   const ey=c.start[1]+(c.end[1]-c.start[1])*p-11;
   eggs.appendChild(node('ellipse',{cx:ex,cy:ey,rx:10.5,ry:14,fill:'#253c32',stroke:'#253c32','stroke-width':2,transform:'rotate('+(egg.lane.endsWith('l')?'-25':'25')+' '+ex+' '+ey+')'}));
 }
 $('lcdScore').textContent=String(game.score%1000).padStart(3,'0');
 $('lcdMode').textContent=game.mode===MODE.turbo?'SPIEL B':'SPIEL A';
 $('record').textContent='REKORD '+String(Math.max(best[selectedMode],game.score)).padStart(3,'0');
 const miss=$('missIcons');miss.replaceChildren();
 for(let i=0;i<Math.ceil(game.misses);i++){
   const half=i===Math.floor(game.misses) && game.misses%1!==0;
   if(half&&Math.floor(game.elapsed/340)%2===1)continue;
   const x=700+i*35,y=429;
   miss.appendChild(node('path',{d:'M'+(x-9)+' '+(y+3)+' Q'+(x-18)+' '+(y-13)+' '+x+' '+(y-16)+' Q'+(x+13)+' '+(y-17)+' '+(x+12)+' '+y+' L'+(x+20)+' '+(y+3)+' L'+(x+10)+' '+(y+6)+' Q'+(x+11)+' '+(y+14)+' '+(x-8)+' '+(y+12)+' Z',fill:'#30463a'}));
   miss.appendChild(node('circle',{cx:x+5,cy:y-7,r:2.1,fill:'#b9c9ae'}));
 }
 if(game.chickUntil>game.elapsed && game.status!=='ready'){
   const c=lanes[game.chickLane];if(c){
     const x=c.end[0]+(game.chickLane.endsWith('l')?-4:4),y=c.end[1]+20;
     miss.appendChild(node('path',{d:'M'+(x-12)+' '+y+' q0 -17 13 -17 q14 0 12 14 l11 3 l-11 4 q-5 13 -18 2 Z',fill:'#354c3e'}));
   }
 }
 for(const el of document.querySelectorAll('.face-button'))el.classList.toggle('selected',el.dataset.lane===game.lane);
 for(const el of document.querySelectorAll('.micro-button'))el.classList.toggle('active',el.dataset.action===selectedMode);
}
let raf=0;function frame(t){if(!last)last=t;const dt=Math.max(0,Math.min(180,t-last));last=t;if(game.status==='running'){game.tick(dt);for(const evt of game.drainEvents()){if(evt.type==='catch')beep(760,.045);else if(evt.type==='miss')beep(210,.15);else if(evt.type==='gameover'){if(game.score>best[selectedMode]){best[selectedMode]=game.score;try{localStorage.setItem('eieralarm-lcd-best-'+selectedMode,best[selectedMode])}catch{}}$('message').innerHTML=`ENDE · ${game.score} PUNKTE<br>NOCH EINMAL?`;$('start').textContent='▶ NEUSTART';$('start').hidden=false;}}draw()}raf=requestAnimationFrame(frame);}raf=requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.status==='running'){game.togglePause();$('message').textContent='PAUSE';$('start').textContent='▶ WEITERSPIELEN';$('start').hidden=false;draw();}});
// In Safari the screen orientation is not lockable without installing a PWA; the portrait gate guides rotation.
window.addEventListener('pagehide',()=>{if(game.status==='running')game.togglePause()});draw();
