name = "cryptopilot-cloud-paper-preview"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
PAPER_AUTOTRADE_ENABLED = "true"

# No public routes. Cron requires a separate PAPER_CRON_KEY secret (>=32 chars).
[[durable_objects.bindings]]
name = "PAPER_LEDGER"
class_name = "PaperLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PaperLedger"]

[[durable_objects.bindings]]
name = "PAPER_SESSIONS"
class_name = "PaperSessions"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["PaperSessions"]
